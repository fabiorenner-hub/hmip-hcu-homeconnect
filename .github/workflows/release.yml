name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build-and-release:
    needs: test
    # Native ARM64 runner — the HCU is ARM64. Building natively avoids slow
    # QEMU emulation that would otherwise take 30+ minutes for `npm install`.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build HCU plugin image tarball
        run: npm run package

      - name: Build stable OTA payload
        run: |
          npm run build
          npm run build:ota

      - name: Upload HCU plugin tarball + OTA payload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hmip-hcu-homeconnect-*.tar.gz
            dist/ota/ota-manifest.json
            dist/ota/homeconnect-ota-*.json
          draft: false
          prerelease: false
          body_path: .github/release-notes-${{ github.ref_name }}.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
